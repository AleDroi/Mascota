name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Crear proyecto
        run: |
          set -e
          mkdir -p proyecto && cd proyecto
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.mascota"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.mascota"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Mascota"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".AskActivity"
                      android:exported="false"
                      android:theme="@style/Theme.AppCompat.Light.Dialog" />

                  <service
                      android:name=".PetService"
                      android:foregroundServiceType="specialUse"
                      android:exported="false">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Mascota virtual flotante" />
                  </service>

              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/AskActivity.kt)
          cat > app/src/main/java/com/example/mascota/AskActivity.kt <<'EOF'
          package com.example.mascota
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          class AskActivity : AppCompatActivity() {
              private lateinit var box: EditText
              private val voz = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val t = r.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()
                  if (t != null) { box.setText(t); buscar() }
              }
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  title = "🐶 ¿Qué investigo?"
                  box = EditText(this).apply {
                      hint = "Pídele algo a tu perrito"; setSingleLine(); imeOptions = EditorInfo.IME_ACTION_SEARCH
                      setOnEditorActionListener { _, _, _ -> buscar(); true }
                  }
                  val mic = Button(this).apply {
                      text = "🎤 Hablar"
                      setOnClickListener {
                          try { voz.launch(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                              .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM))
                          } catch (e: Exception) { Toast.makeText(context, "No hay reconocimiento de voz", Toast.LENGTH_SHORT).show() }
                      }
                  }
                  val go = Button(this).apply { text = "🔍 Investigar"; setOnClickListener { buscar() } }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(48, 32, 48, 32)
                      addView(box); addView(mic); addView(go)
                  })
              }
              private fun buscar() {
                  val q = box.text.toString().trim()
                  if (q.isEmpty()) return
                  startService(Intent(this, PetService::class.java).setAction("BUSCAR"))
                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q))))
                  finish()
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/Bark.kt)
          cat > app/src/main/java/com/example/mascota/Bark.kt <<'EOF'
          package com.example.mascota
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioTrack
          import android.os.Handler
          import android.os.Looper
          import java.util.Random
          object Bark {
              private val rnd = Random()
              fun play(pitch: Float) {
                  Thread {
                      val sr = 22050
                      val n = (sr * 0.17).toInt()
                      val b = ShortArray(n)
                      var ph = 0.0
                      for (i in 0 until n) {
                          val t = i / n.toDouble()
                          ph += 2 * Math.PI * (650 - 400 * t) * pitch / sr
                          val env = Math.pow(1 - t, 1.5) * Math.min(1.0, t * 40)
                          val s = (Math.sin(ph) + 0.5 * Math.sin(2 * ph) + 0.7 * (rnd.nextDouble() - 0.5)) * env
                          b[i] = (s * 9000).toInt().toShort()
                      }
                      try {
                          val at = AudioTrack(AudioManager.STREAM_MUSIC, sr, AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT, n * 2, AudioTrack.MODE_STATIC)
                          at.write(b, 0, n)
                          at.play()
                          Handler(Looper.getMainLooper()).postDelayed({ at.release() }, 500)
                      } catch (e: Exception) {}
                  }.start()
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/MainActivity.kt)
          cat > app/src/main/java/com/example/mascota/MainActivity.kt <<'EOF'
          package com.example.mascota

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val iniciar = Button(this).apply { text = "Activar mascota" }
                  val detener = Button(this).apply { text = "Quitar mascota" }

                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                      addView(iniciar)
                      addView(detener)
                  })

                  iniciar.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          // Lleva a la pantalla "Mostrar sobre otras apps"
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      } else {
                          startForegroundService(Intent(this, PetService::class.java))
                      }
                  }

                  detener.setOnClickListener {
                      stopService(Intent(this, PetService::class.java))
                  }
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/PetService.kt)
          cat > app/src/main/java/com/example/mascota/PetService.kt <<'EOF'
          package com.example.mascota
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.*
          import android.view.*
          import androidx.core.app.NotificationCompat
          import kotlin.math.*
          class PetService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var v: PetView
              private lateinit var lp: WindowManager.LayoutParams
              private val h = Handler(Looper.getMainLooper())
              private val rnd = java.util.Random()
              private var k = 3; private var W = 0; private var H = 0
              private var state = "idle"; private var until = 0L; private var lastTouch = 0L; private var lastTap = 0L
              private var dir = 1; private var t = 0
              private var px = 100f; private var py = 0f; private var vy = 0f; private var vx = 0f
              private var say = ""; private var sayUntil = 0L
              private var touching = false; private var moved = false
              private var dX = 0f; private var dY = 0f; private var sX = 0f; private var sY = 0f
              private val ladridos = listOf("¡Guau!", "¡Guau guau!", "¡Wof!", "¡Arf arf!", "¡Yip yip!", "Grrr... ¡guau!")
              private val loop = object : Runnable { override fun run() { tick(); h.postDelayed(this, 70) } }
              private val longPress = Runnable { if (touching && !moved) { state = "happy"; until = Long.MAX_VALUE } }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i?.action == "BUSCAR") { say = "¡Guau! Voy a buscar 🔎"; ladrar(3) }
                  return START_STICKY
              }

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("mascota", "Mascota", NotificationManager.IMPORTANCE_MIN))
                  startForeground(1, NotificationCompat.Builder(this, "mascota")
                      .setContentTitle("Tu perrito está despierto 🐶")
                      .setSmallIcon(android.R.drawable.ic_menu_myplaces).build())
                  Sprites.load(this)
                  k = (resources.displayMetrics.density * 1.3f).roundToInt().coerceAtLeast(2)
                  W = 80 * k; H = 92 * k
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  v = PetView(this, k)
                  lp = WindowManager.LayoutParams(W, H, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.TOP or Gravity.START
                  py = resources.displayMetrics.heightPixels - H - 24f * resources.displayMetrics.density
                  lastTouch = SystemClock.uptimeMillis()
                  v.setOnTouchListener { _, e -> touch(e); true }
                  wm.addView(v, lp)
                  h.post(loop)
                  say = "¡Guau! ¡Hola!"; sayUntil = SystemClock.uptimeMillis() + 2500
                  ladrar(2)
              }

              private fun ground() = resources.displayMetrics.heightPixels - H - 24f * resources.displayMetrics.density

              private fun ladrar(n: Int) {
                  val now = SystemClock.uptimeMillis()
                  if (say.isEmpty() || now > sayUntil) say = ladridos[rnd.nextInt(ladridos.size)]
                  state = "bark"; until = now + n * 300L + 350; sayUntil = until + 700
                  repeat(n) { i -> h.postDelayed({ Bark.play(0.9f + rnd.nextFloat() * 0.35f) }, i * 300L) }
              }

              private fun decide(now: Long) {
                  val r = rnd.nextInt(100)
                  when {
                      r < 38 -> { state = "walk"; dir = if (rnd.nextBoolean()) 1 else -1; until = now + 2000 + rnd.nextInt(4000) }
                      r < 50 -> { say = ""; ladrar(1 + rnd.nextInt(2)) }
                      r < 62 -> { state = "dance"; until = now + 2500 }
                      r < 74 -> { state = "curious"; until = now + 2200 }
                      r < 80 -> { dir = -dir; until = now + 1000 }
                      else -> until = now + 1500 + rnd.nextInt(3000)
                  }
              }

              private fun tick() {
                  val now = SystemClock.uptimeMillis(); t++
                  val sw = resources.displayMetrics.widthPixels
                  v.angle = 0f; v.sx = 1f; v.sy = 1f; v.dy = 0f; v.emoji = ""; v.flip = dir.toFloat()
                  val g = ground()
                  when (state) {
                      "idle" -> { v.bmp = Sprites.front; v.sy = 1f + 0.02f * sin(t * 0.25f)
                          if (now - lastTouch > 40000) state = "sleep" else if (now > until) decide(now) }
                      "walk" -> { v.bmp = Sprites.walk[(t / 3) % 4]; px += dir * 2.2f * k; v.dy = -abs(sin(t * 0.8f)) * k
                          if (px < 0) { px = 0f; dir = 1 }; if (px > sw - W) { px = (sw - W).toFloat(); dir = -1 }
                          if (now > until) { state = "idle"; until = now + 1500 } }
                      "sleep" -> { v.bmp = Sprites.front; v.sy = 0.9f + 0.02f * sin(t * 0.1f); v.emoji = if ((t / 10) % 2 == 0) "💤" else "💤 "
                          if (now - lastTouch > 90000 && rnd.nextInt(80) == 0) { state = "idle"; lastTouch = now } }
                      "bark" -> { v.bmp = Sprites.bark; v.dy = -abs(sin(t * 0.9f)) * 3 * k; v.emoji = "❗"
                          if (now > until) { state = "idle"; until = now + 1200 } }
                      "happy" -> { v.bmp = Sprites.happy; v.angle = sin(t * 0.7f) * 5; v.emoji = if ((t / 8) % 2 == 0) "❤️" else "✨"
                          if (!touching && now > until) { state = "idle"; until = now + 800 } }
                      "dance" -> { v.bmp = Sprites.happy; v.angle = sin(t * 0.6f) * 8; v.dy = -abs(sin(t * 0.6f)) * 4 * k; v.emoji = "🎵"
                          if (now > until) { state = "idle"; until = now + 800 } }
                      "curious" -> { v.bmp = Sprites.front; v.angle = sin(t * 0.15f) * 6; v.emoji = "❓"
                          if (now > until) { state = "idle"; until = now + 800 } }
                      "drag" -> { v.bmp = Sprites.front; v.emoji = "❗"; v.angle = (vx * 0.8f).coerceIn(-25f, 25f); vx *= 0.8f }
                      "fall" -> { v.bmp = Sprites.front; v.emoji = "❗"; vy += 1.6f * k; py += vy
                          if (py >= g) { py = g; state = "land"; until = now + 500 } }
                      "land" -> { v.bmp = Sprites.front; v.sy = 0.82f; v.emoji = "💫"
                          if (now > until) { state = "idle"; until = now + 800 } }
                  }
                  if (state != "drag" && state != "fall") py = g
                  v.say = if (now < sayUntil) say else ""
                  lp.x = px.toInt(); lp.y = py.toInt()
                  try { wm.updateViewLayout(v, lp) } catch (e: Exception) {}
                  v.invalidate()
              }

              private fun touch(e: MotionEvent) {
                  val now = SystemClock.uptimeMillis()
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          touching = true; moved = false; lastTouch = now
                          dX = e.rawX; dY = e.rawY; sX = px; sY = py
                          if (state == "sleep") { state = "idle"; until = now + 800; ladrar(1) }
                          h.postDelayed(longPress, 450)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = e.rawX - dX; val dy = e.rawY - dY
                          if (!moved && hypot(dx, dy) > 14 * resources.displayMetrics.density) {
                              moved = true; h.removeCallbacks(longPress); state = "drag"
                          }
                          if (moved) {
                              val nx = sX + dx; vx = nx - px; px = nx
                              py = (sY + dy).coerceIn(0f, ground())
                              lastTouch = now
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          touching = false; h.removeCallbacks(longPress); lastTouch = now
                          if (moved) { state = "fall"; vy = 0f }
                          else if (state == "happy") until = now + 2500
                          else {
                              if (now - lastTap < 350) {
                                  startActivity(Intent(this, AskActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  say = "¿Qué busco? ¡Guau!"; sayUntil = now + 2500; state = "curious"; until = now + 2500
                              } else { say = ""; ladrar(1 + rnd.nextInt(2)) }
                              lastTap = now
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  if (::v.isInitialized) wm.removeView(v)
                  super.onDestroy()
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/PetView.kt)
          cat > app/src/main/java/com/example/mascota/PetView.kt <<'EOF'
          package com.example.mascota
          import android.content.Context
          import android.graphics.*
          import android.view.View
          class PetView(c: Context, val k: Int) : View(c) {
              var bmp: Bitmap? = null
              var flip = 1f; var angle = 0f; var sx = 1f; var sy = 1f; var dy = 0f
              var emoji = ""; var say = ""
              private val p = Paint().apply { isFilterBitmap = false }
              private val tp = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }
              private val bg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val st = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.DKGRAY; style = Paint.Style.STROKE; strokeWidth = k * 0.6f }
              override fun onMeasure(w: Int, h: Int) = setMeasuredDimension(80 * k, 92 * k)
              override fun onDraw(c: Canvas) {
                  val b = bmp ?: return
                  val w = b.width * k; val h = b.height * k
                  val cx = width / 2f; val bottom = height - 2f * k
                  c.save()
                  c.translate(0f, dy)
                  c.rotate(angle, cx, bottom)
                  c.scale(flip * sx, sy, cx, bottom)
                  c.drawBitmap(b, null, RectF(cx - w / 2, bottom - h, cx + w / 2, bottom), p)
                  c.restore()
                  if (emoji.isNotEmpty()) {
                      tp.textSize = 11f * k
                      c.drawText(emoji, cx + w * 0.38f, bottom - h * sy + 9f * k + dy, tp)
                  }
                  if (say.isNotEmpty()) {
                      tp.textSize = 7f * k; tp.color = Color.BLACK
                      val tw = tp.measureText(say) / 2 + 3f * k
                      val bx = cx.coerceIn(tw + k, width - tw - k)
                      val r = RectF(bx - tw, 2f * k, bx + tw, 13f * k)
                      c.drawRoundRect(r, 4f * k, 4f * k, bg); c.drawRoundRect(r, 4f * k, 4f * k, st)
                      c.drawText(say, bx, 10.5f * k, tp)
                  }
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/Sprites.kt)
          cat > app/src/main/java/com/example/mascota/Sprites.kt <<'EOF'
          package com.example.mascota
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          object Sprites {
              lateinit var front: Bitmap
              lateinit var bark: Bitmap
              lateinit var happy: Bitmap
              lateinit var walk: List<Bitmap>
              fun load(c: Context) {
                  fun l(n: String) = BitmapFactory.decodeStream(c.assets.open("$n.png"))
                  front = l("front"); bark = l("bark"); happy = l("happy")
                  walk = List(4) { l("w$it") }
              }
          }
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mascota"
          include(":app")
