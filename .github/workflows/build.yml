name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Crear proyecto
        run: |
          set -e
          mkdir -p proyecto && cd proyecto
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mascota"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.mascota"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.mascota"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Mascota"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PetService"
                      android:foregroundServiceType="specialUse"
                      android:exported="false">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Mascota virtual flotante" />
                  </service>

              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/MainActivity.kt)
          cat > app/src/main/java/com/example/mascota/MainActivity.kt <<'EOF'
          package com.example.mascota
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val iniciar = Button(this).apply { text = "Activar mascota" }
                  val detener = Button(this).apply { text = "Quitar mascota" }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                      addView(iniciar)
                      addView(detener)
                  })
                  iniciar.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      } else {
                          startForegroundService(Intent(this, PetService::class.java))
                      }
                  }
                  detener.setOnClickListener {
                      stopService(Intent(this, PetService::class.java))
                  }
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/mascota/PetService.kt)
          cat > app/src/main/java/com/example/mascota/PetService.kt <<'EOF'
          package com.example.mascota
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import kotlin.math.abs
          class PetService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var pet: TextView
              private lateinit var params: WindowManager.LayoutParams
              private val handler = Handler(Looper.getMainLooper())
              private val caras = listOf("🐱", "😺", "😸", "😻")
              private val dormida = "😴"
              private var estado = 0
              private val dormir = Runnable { pet.text = dormida }
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  iniciarNotificacion()
                  crearMascota()
              }
              private fun iniciarNotificacion() {
                  val canal = "mascota"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(canal, "Mascota", NotificationManager.IMPORTANCE_MIN)
                      )
                  }
                  val notif = NotificationCompat.Builder(this, canal)
                      .setContentTitle("Tu mascota está activa")
                      .setSmallIcon(android.R.drawable.ic_menu_myplaces)
                      .build()
                  startForeground(1, notif)
              }
              private fun crearMascota() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  pet = TextView(this).apply {
                      text = caras[0]
                      textSize = 48f
                  }
                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 400
                  }
                  pet.setOnTouchListener(object : View.OnTouchListener {
                      var inicioX = 0; var inicioY = 0
                      var toqueX = 0f; var toqueY = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  inicioX = params.x; inicioY = params.y
                                  toqueX = e.rawX; toqueY = e.rawY
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = inicioX + (e.rawX - toqueX).toInt()
                                  params.y = inicioY + (e.rawY - toqueY).toInt()
                                  wm.updateViewLayout(pet, params)
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (abs(e.rawX - toqueX) < 15 && abs(e.rawY - toqueY) < 15) {
                                      reaccionar()
                                  }
                              }
                          }
                          return true
                      }
                  })
                  wm.addView(pet, params)
                  reiniciarSueno()
              }
              private fun reaccionar() {
                  estado = (estado + 1) % caras.size
                  pet.text = caras[estado]
                  pet.animate().scaleX(1.4f).scaleY(1.4f).setDuration(120).withEndAction {
                      pet.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                  }.start()
                  reiniciarSueno()
              }
              private fun reiniciarSueno() {
                  handler.removeCallbacks(dormir)
                  handler.postDelayed(dormir, 10_000)
              }
              override fun onDestroy() {
                  handler.removeCallbacks(dormir)
                  if (::pet.isInitialized) wm.removeView(pet)
                  super.onDestroy()
              }
          }
          EOF
      - run: cd proyecto && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mascota-apk
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
